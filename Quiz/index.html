<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Subject Selection Screen -->
  <div id="subject-screen" class="screen">
    <div class="card">
      <h1>🎯 Quiz App</h1>
      <p>Select a subject to begin</p>
      <div class="subject-grid">
        <button class="subject-btn" onclick="startQuiz(1)">📚 GK</button>
        <button class="subject-btn" onclick="startQuiz(2)">📝 English</button>
        <button class="subject-btn" onclick="startQuiz(3)">🔢 Aptitude</button>
        <button class="subject-btn" onclick="startQuiz(4)">🧠 Logical</button>
      </div>
    </div>
  </div>

  <!-- Quiz Screen -->
  <div id="quiz-screen" class="screen hidden">
    <div class="card">
      <div class="quiz-header">
        <span id="subject-label"></span>
        <span id="progress"></span>
      </div>
      <h2 id="question-text"></h2>
      <div class="options" id="options"></div>
      <button id="next-btn" class="next-btn hidden" onclick="nextQuestion()">Next →</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="result-screen" class="screen hidden">
    <div class="card">
      <h1 id="result-emoji"></h1>
      <h2>Quiz Completed!</h2>
      <p id="score-text"></p>
      <p id="percentage-text"></p>
      <button class="subject-btn" onclick="restart()">🔄 Play Again</button>
    </div>
  </div>

  <script src="quiz.js"></script>
</body>
</html>
